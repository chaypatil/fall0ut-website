<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Your ticket · FallØut India</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap" />
    <link rel="stylesheet" href="/portal/portal.css" />
    <style>
      /* The buyer opens this in a queue, often on no signal. Everything needed to
         draw the QR is in the URL, so nothing is fetched to render this page. */
      body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
      .pass { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 380px; }
      .pass h1 { margin: 0; font-size: 1.5rem; }
      .pass .qr { background: #fff; padding: 14px; border-radius: 10px; }
      .pass .brand { color: var(--mint); font-size: 0.74rem; letter-spacing: 0.3em; text-transform: uppercase; }
      .pass .note { color: var(--muted); font-size: 0.86rem; }
    </style>
  </head>
  <body>
    <div class="pass">
      <p class="brand">FallØut India</p>
      <h1>Entry pass</h1>
      <div class="qr" data-qr></div>
      <p class="note" data-note>Show this QR at the gate. It works once.</p>
      <p class="note">Screenshot this now. It will open without signal.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      const token = decodeURIComponent(window.location.hash.replace(/^#/, "")).trim();

      if (!/^[a-f0-9]{16,64}$/i.test(token)) {
        document.querySelector("[data-note]").textContent =
          "This link is incomplete. Ask FallØut to resend it.";
      } else {
        new QRCode(document.querySelector("[data-qr]"), {
          text: token,
          width: 260,
          height: 260,
          correctLevel: QRCode.CorrectLevel.M,
        });
        try {
          // Lets the buyer reopen the pass from this device even with no signal.
          localStorage.setItem("fallout_last_pass", token);
        } catch (error) {
          /* private mode, nothing to do */
        }
      }
    </script>
  </body>
</html>
